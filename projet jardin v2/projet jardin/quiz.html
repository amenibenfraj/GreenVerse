<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz Jardinage - GreenVerse</title>
<link rel="stylesheet" href="style.css">
<style>
/* =================== QUIZ =================== */
.quiz-hero {
  height: 50vh;
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  position:relative;
  background: linear-gradient(120deg, #f0fff0, #e6f0ff);
  padding-top:70px;
}

.quiz-hero h1 {
  font-size:3em;
  color:#2e7d32;
  margin-bottom:20px;
  font-family:'Poppins',sans-serif;
}

.quiz-hero p {
  font-size:1.3em;
  color:#1b5e20;
}

/* QUIZ CARDS */
.quiz-container {
  max-width: 800px;
  margin: 50px auto;
  padding: 30px;
  background: #fffaf0;
  border-radius: 25px;
  box-shadow: 0 12px 25px rgba(0,0,0,0.1);
  display: flex;
  flex-direction: column;
  gap: 30px;
}

.quiz-question {
  background: #f0ffe0;
  padding: 20px;
  border-radius: 20px;
  box-shadow: 0 5px 15px rgba(0,0,0,0.1);
}

.quiz-question h3 {
  color: #2e7d32;
  margin-bottom: 15px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.options label {
  background: #e6ffe6;
  padding: 10px 15px;
  border-radius: 15px;
  cursor: pointer;
  transition: 0.3s;
  display: flex;
  align-items: center;
  gap: 10px;
}

.options input[type="radio"] {
  cursor: pointer;
}

.options label:hover {
  background: #d4f5c4;
  transform: translateY(-2px);
}

/* BOUTON SUBMIT */
button {
  background: #2e7d32;
  color: white;
  padding: 16px 32px;
  border-radius: 35px;
  font-weight: bold;
  border: none;
  cursor: pointer;
  font-size: 1em;
  transition: all 0.3s ease;
  align-self: center;
}

button:hover {
  background: #1f6f43;
  transform: scale(1.08) translateY(-2px);
}

/* FEEDBACK */
.feedback {
  display: none;
  margin-top: 10px;
  font-weight: bold;
}

input:checked + span.correct ~ .feedback.correct {
  display: block;
  color: #2e7d32;
}

input:checked + span.incorrect ~ .feedback.incorrect {
  display: block;
  color: #c62828;
}

/* Responsive */
@media (max-width: 600px) {
  .quiz-container { padding: 20px; }
}
</style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar">
  <a href="index.html" class="logo"><span>🌱</span>GreenVerse</a>
  <div>
    <a href="index.html">Accueil</a>
    <a href="jardin.html">Jardin</a>
    <a href="tableaux.html">Infos Plantes</a>
    <a href="ateliers.html">Ateliers</a>
    <a href="shop.html">Boutique</a>
    <a href="blog.html">Blog</a>
    <a href="quiz.html">Quiz</a>
    <a href="faq.html">FAQ</a>
    <a href="astuce.html">Astuce du jour</a>
    <a href="contact.html">Contact</a>
    <a href="about.html" class="active">À propos</a>
  </div>
</nav>
<!-- HERO -->
<section class="quiz-hero">
  <h1>Quiz Jardinage</h1>
  <p>Testez vos connaissances en jardinage 🌿</p>
</section>

<!-- QUIZ -->
<section class="quiz-container">

  <!-- Question 1 -->
  <div class="quiz-question">
    <h3>1. Quelle plante est aromatique ?</h3>
    <div class="options">
      <label><input type="radio" name="q1"><span class="incorrect">Tomate</span><div class="feedback incorrect">Incorrect</div></label>
      <label><input type="radio" name="q1"><span class="correct">Basilic</span><div class="feedback correct">Correct ! 🌿</div></label>
      <label><input type="radio" name="q1"><span class="incorrect">Carotte</span><div class="feedback incorrect">Incorrect</div></label>
    </div>
  </div>

  <!-- Question 2 -->
  <div class="quiz-question">
    <h3>2. Quel arbre est fruitier ?</h3>
    <div class="options">
      <label><input type="radio" name="q2"><span class="correct">Pommier</span><div class="feedback correct">Correct ! 🍏</div></label>
      <label><input type="radio" name="q2"><span class="incorrect">Érable</span><div class="feedback incorrect">Incorrect</div></label>
      <label><input type="radio" name="q2"><span class="incorrect">Lierre</span><div class="feedback incorrect">Incorrect</div></label>
    </div>
  </div>

  <!-- Question 3 -->
  <div class="quiz-question">
    <h3>3. Quelle plante nécessite beaucoup de lumière ?</h3>
    <div class="options">
      <label><input type="radio" name="q3"><span class="correct">Tomates</span><div class="feedback correct">Correct ! ☀️</div></label>
      <label><input type="radio" name="q3"><span class="incorrect">Menthe</span><div class="feedback incorrect">Incorrect</div></label>
      <label><input type="radio" name="q3"><span class="incorrect">Lotus</span><div class="feedback incorrect">Incorrect</div></label>
    </div>
  </div>

  <button type="button" onclick="alert('Ceci est un quiz CSS-only. Pour un vrai scoring, JavaScript est nécessaire')">Valider</button>
</section>

<footer>© 2025 GreenVerse</footer>
</body>
</html>
